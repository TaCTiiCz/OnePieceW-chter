# =====================================================================
#  Händler-Konfiguration für den One-Piece-TCG-Wächter
# =====================================================================
#
#  Jeder Händler steht in einem eigenen Block [shops.<kurzname>].
#  Die Angaben unter "pruefung" wurden am angegebenen Datum von Hand
#  (über die öffentlichen Shop-Seiten) dokumentiert. Details und Quellen:
#  docs/haendlerpruefung.md
#
#  WICHTIG:
#  - kaufalarm_freigegeben = true nur nach dokumentierter Prüfung.
#    Nicht freigegebene Händler erscheinen im Bericht, lösen aber
#    KEINE Telegram-Kaufalarme aus.
#  - Versandkosten nach Deutschland: Nur eintragen, was auf der
#    Händlerseite belegt ist. Unbekannt bleibt unbekannt (status = "unbekannt").
#  - Shop-Seriosität und Case-Hunting-Risiko werden NICHT bewertet,
#    solange keine belastbaren Belege vorliegen.
# =====================================================================

# Händler, die niemals überwacht werden dürfen.
# Der Wächter verweigert den Start, wenn ein Shop unten gegen diese Liste verstößt.
# TCG Distro / tcgdistronline.com ist zusätzlich FEST im Code ausgeschlossen (dauerhaft).
[ausschluss]
domains = ["tcgdistro.com", "tcgdistronline.com"]
namensmuster = ["tcg distro", "tcgdistro", "tcg-distro"]
# Gesperrt, bis eine dokumentierte Vertrauensprüfung vorliegt (docs/haendlerpruefung.md).
# Erst nach dieser Prüfung den Eintrag hier entfernen.
bis_vertrauenspruefung = ["tcgzenith", "tcg zenith", "tcg-zenith"]

# ---------------------------------------------------------------------
[shops.cardcosmos]
name = "cardcosmos"
basis_url = "https://cardcosmos.de"
land = "DE"
plattform = "shopify"
waehrung = "EUR"
# Wo der Wächter nach One-Piece-Produkten sucht (Shopify-Kollektionen)
kollektionen = ["one-piece-karten-kaufen"]
max_seiten = 3
# Höflichkeit: Mindestabstand zwischen zwei Abrufen und Obergrenze pro Lauf
min_abstand_sekunden = 4
max_anfragen_pro_lauf = 80
kaufalarm_freigegeben = true

[shops.cardcosmos.versand_de]
status = "bekannt"
# Staffel: ab Bestellwert (EUR) -> Versandkosten (EUR)
staffel = [{ ab = 0.0, kosten = 4.99 }]
hinweis = "Laut Versandseite 4,99 € pro Bestellung innerhalb Deutschlands."
quelle = "https://cardcosmos.de/policies/shipping-policy"
geprueft_am = "2026-10-06"

[shops.cardcosmos.pruefung]
geprueft_am = "2026-10-06"
impressum = "cardcosmos GmbH, Bremland 34, 24857 Fahrdorf, Deutschland; HRB16880 AG Flensburg; USt-ID DE366668128"
impressum_quelle = "https://cardcosmos.de/policies/legal-notice"
liefert_nach_de = true
fuehrt_englische_op_displays = true
seriositaet = "nicht bewertet (keine belastbaren Belege gesammelt)"
case_herkunft = "unbekannt"

