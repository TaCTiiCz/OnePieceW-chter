# =====================================================================
#  Ziel-Produkte des One-Piece-TCG-Wächters
# =====================================================================
#  Der Wächter liest die Produktlisten der Händler und ordnet jedes
#  Angebot über Titel, Varianten und Tags einem Ziel zu. Nur Angebote,
#  die Sprache = Englisch UND den richtigen Produkttyp eindeutig
#  erkennen lassen, gelten als "sicherer Treffer". Unklare Angebote
#  landen im Bericht unter "unsichere Treffer" (ohne Kaufalarm).
# =====================================================================

[allgemein]
# Preisrückgang wird erst ab dieser Schwelle gemeldet (beides muss erfüllt sein)
preisrueckgang_min_prozent = 3.0
preisrueckgang_min_euro = 2.0
# Gleiche Meldung wird innerhalb dieser Zeit nicht erneut verschickt
wiederholsperre_stunden = 24
# "Neu gelistet" nur, wenn das Produkt laut Shop höchstens so viele Tage veröffentlicht ist (Shopify: published_at).
# Ältere Produkte, die der Wächter nur erstmals SIEHT (z. B. über einen neuen Suchweg), werden still übernommen.
neu_gelistet_max_tage = 14
# Wird erhöht, wenn neue Produkte aufgenommen werden: Der erste volle Lauf je Shop übernimmt bereits gelistete
# Angebote dieser Produkte still (kein "neu gelistet"-Schwall für alte Angebote).
produkt_version = 2
# Treffer bei Shops, die noch nicht für Kaufalarme geprüft sind: trotzdem melden (mit Warnung + Fake-Shop-Check),
# wenn der Preis innerhalb deiner Grenze liegt
ungepruefte_shops_melden = true

# ---------------------------------------------------------------------
# Preisgrenzen für Kaufalarme
# - Restock und Preisrückgang: Alarm nur, wenn Preis <= Grenze. Grenze = eigener Wert pro Set (unten), sonst dein
#   Höchstpreis max_kaufpreis_eur. (0 = automatisch Marktpreis: Median der günstigsten Preise der anderen Händler.)
#   Teurere Restocks stehen nur im Bericht.
# - Neue Vorbestellung / neu gelistet: wird IMMER gemeldet, mit Hinweis "💸 über deinem Höchstpreis" bzw.
#   "💰 unter Marktpreis". Jede Meldung zeigt den Marktvergleich.
# ---------------------------------------------------------------------
[preisgrenzen]
max_kaufpreis_eur = 250       # Displays kaufe ich höchstens für 250 € (Stand 12.10.2026)
toleranz_prozent = 0          # nur relevant, wenn max_kaufpreis_eur = 0
min_vergleichspreise = 3
display_ohne_vergleich_eur = 200
display_min_eur = 40          # darunter ist es kein Display (Einzelbooster/Fehler) -> kein Alarm
# Eigene Grenzen pro Set in Euro (überschreiben den Höchstpreis), z. B.:
# OP13 = 160

# ---------------------------------------------------------------------
# 1) Booster Displays (24 Packs) aller OP-Sets ab OP01, nur Englisch
# ---------------------------------------------------------------------
[displays]
ab_set = 1
# Höchstes Set, das Bandai/Distributoren schon führen. Höhere Sets (z. B. OP20–OP24 als Platzhalter-Vorbestellung)
# gelten als spekulativ: sie stehen im Bericht, lösen aber KEINEN Kaufalarm aus. Bei neuer Ankündigung um 1 erhöhen.
bekannt_bis_set = 19
# Besonders wichtige Sets (erscheinen im Bericht zuerst, Telegram markiert sie)
prioritaet = ["OP13", "OP15", "OP09", "OP18", "OP16", "OP11"]

# Englische Set-Namen, damit auch Titel ohne Set-Code erkannt werden.
# Quelle: offizielle englische Seite en.onepiece-cardgame.com (Stand 2026-10-06)
[displays.setnamen]
OP01 = ["romance dawn"]
OP02 = ["paramount war"]
OP03 = ["pillars of strength"]
OP04 = ["kingdoms of intrigue"]
OP05 = ["awakening of the new era"]
OP06 = ["wings of the captain"]
OP07 = ["500 years in the future"]
OP08 = ["two legends"]
OP09 = ["emperors in the new world"]
OP10 = ["royal blood"]
OP11 = ["a fist of divine speed"]
OP12 = ["legacy of the master"]
OP13 = ["carrying on his will"]
OP14 = ["the azure sea's seven", "the azure seas seven"]
OP15 = ["adventure on kami's island", "adventure on kamis island"]
OP16 = ["the time of battle"]
OP17 = ["the world's strongest warriors", "the worlds strongest warriors"]
OP18 = ["the dominance of god"]

# ---------------------------------------------------------------------
# 2) Englische Sleeved Booster
# ---------------------------------------------------------------------
[sleeved]
sets = ["OP09", "OP13"]

# ---------------------------------------------------------------------
# 3) Sonderprodukte – Identität anhand offizieller Quellen geklärt
#    (siehe docs/produktidentitaet.md)
# ---------------------------------------------------------------------
[[sonderprodukte]]
id = "pcc-29th"
anzeige = "Premium Card Collection -29th Anniversary Edition- (EN)"
typ = "PREMIUM_CARD_COLLECTION"
# Alle Begriffe einer Gruppe müssen im Titel vorkommen
muss_enthalten = [["premium card collection", "29th"]]
# Diese Begriffe schließen eine Verwechslung aus
darf_nicht_enthalten = ["25th", "best selection", "live action", "6 assort", "ace & sabo", "ace&sabo"]
identitaet = "bestaetigt"
offizielle_quelle = "https://en.onepiece-cardgame.com/products/cardcollection29th.html"
offizieller_inhalt = "P-159 in 2 Versionen: Normal x4 und Premium-Finish x4; UVP USD 10; Premium Bandai (US/AU/NZ)"
max_eur = 40


# ---------------------------------------------------------------------
# 4) Anniversary-Sets (Premium Bandai) – ALLE bekannten + künftige automatisch
#    Erkennung: "<Zahl> Anniversary Set" (1st/2nd/3./4th …) im Titel. "Japanese …"-Ausgaben
#    (englischer Kartentext, offiziell so benannt) sind eigene Produkte.
#    Quellen: en.onepiece-cardgame.com/products/other/ (Stand 13.10.2026)
# ---------------------------------------------------------------------
[anniversary]
# Künftige Sets (z. B. 5th) werden automatisch erkannt und gemeldet, auch bevor sie hier stehen
automatisch_kuenftige = true
max_eur_unbekannt = 250        # Preisgrenze für Restocks automatisch erkannter Sets
darf_nicht_enthalten = ["complete guide", "official book", "guide book", "base shop", "tournament", "25th",
                        "nur playmat", "playmat only", "only playmat", "promo only", "einzelkarte", "single card",
                        "leer", "empty box", "ohne karten", "without cards"]
# Name offiziell nicht belegt -> nur "unsicher" (kein Kaufalarm)
unsichere_begriffe = ["limited collection"]
# Restock/Preisrückgang nur bis max_eur melden; Vorbestellungen und Neulistungen immer (mit 💸, wenn darüber)

