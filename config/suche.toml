# Suche nach neuen Händlern über die Brave-Search-API (optional, Secret BRAVE_SEARCH_API_KEY oder BRAVE_API_KEY).
# Treffer sind NUR Kandidaten. Jeder neue Shop wird danach live geprüft (Händlerprüfung).
#
# Budget: höchstens `pro_woche` Suchen je Kalenderwoche (Brave: 5 $ Gratis-Guthaben/Monat = ca. 1000 Suchen),
# höchstens `pro_lauf` je Lauf (täglicher Lauf). Die Anfragen werden reihum abgearbeitet, damit über die Wochen
# alle Formulierungen drankommen. Anfragen = feste Liste [[anfragen]] + Kombinationen aus [[gruppen]] (Produkt x Begriff).

[budget]
pro_woche = 100
pro_lauf = 15

[[anfragen]]
q = "\"Naruto Card Game\" Bandai vorbestellen"
land = "DE"

[[anfragen]]
q = "\"Naruto Card Game\" Bandai pre-order booster box"
land = "ALL"

[[anfragen]]
