# =====================================================================
#  Betrieb auf dem EIGENEN SERVER (Oracle Cloud Free Tier)
# =====================================================================
#  Wird nur benutzt, wenn WAECHTER_BETRIEB auf diese Datei zeigt (server/install.sh setzt das).
#  Kürzere Takte als auf GitHub, weil die Schleife ohne Unterbrechung läuft.
#  robots.txt (Crawl-delay), Mindestabstand pro Shop und Händlergrenzen gehen immer vor.
# =====================================================================
[intervalle]
naruto_produktseite = 60           # bekannte Naruto-Produktseiten: jede Minute
naruto_produktseite_fokus = 20     # rund um einen angekündigten Vorbestellstart
entdeckung_naruto = 180            # Naruto-Kategorien und Shopsuche "naruto": alle 3 Min.
entdeckung_schnell = 600           # Neuheiten-Feeds, Vorbestell-Kategorien: 10 Min.
entdeckung_fokus = 120             # im Fokus-Modus
entdeckung_langsam = 10800         # Neuheiten-/Bandai-Kategorien, kompletter Shopify-Katalog: 3 Std.
sitemap = 86400                    # Sitemaps: täglich
offiziell = 900                    # offizielle Naruto-Website: 15 Min.
onepiece = 60                      # One-Piece-Prüfung: 60 s Pause nach jedem Durchlauf (Durchlauf selbst ~30–150 s)

[fokus]
# Zeitfenster um einen bekannten Vorbestellstart, in dem besonders häufig geprüft wird
minuten_vorher = 30
stunden_nachher = 6

[grenzen]
max_laufzeit_sekunden = 170        # ein Lauf endet spätestens nach ~3 Minuten
max_anfragen_pro_lauf = 400
max_anfragen_pro_shop_und_lauf = 12
parallele_shops = 16
onepiece_zeitbudget_sekunden = 150   # One-Piece-Durchlauf: höchstens 2,5 Minuten
min_abstand_sekunden = 3           # Mindestabstand zwischen zwei Anfragen an denselben Shop
max_backoff_minuten = 360          # längste Wartezeit nach wiederholten Fehlern
fehler_push_ab = 3                 # nach so vielen Fehlversuchen in Folge an einer wichtigen Seite: Fehlermeldung

[betrieb]
# Nur zur Anzeige im Dashboard: wie wird der Wächter gestartet?
ausfuehrung = "Eigener Server (Oracle Cloud Free Tier, durchgehender Dauerbetrieb)"
zeitplan_minuten = 0
