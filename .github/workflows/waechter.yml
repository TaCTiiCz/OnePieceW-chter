name: Wächter

# DAUERBETRIEB (Standard): Ein Abschnitt prüft ca. 10 Minuten lang in einer Schleife alle fälligen Aufgaben
# (Naruto alle ~3 Min., One Piece alle ~5 Min.), speichert den Zustand, veröffentlicht das Dojo und reiht am Ende
# selbst den nächsten Abschnitt ein. Der Zeitplan (cron) ist nur noch die Absicherung, falls die Kette einmal reißt.
# Manuelle Aktionen (lauf, Tests) reihen sich in dieselbe Warteschlange ein und setzen danach die Kette fort.
# Zustand, Verlauf und Dashboard liegen im Zweig "waechter-daten" (getrennt vom Code).
# EIGENER SERVER (Repository-Variable BETRIEB=server): Der Server prüft durchgehend; GitHub pausiert und springt
# automatisch ein, wenn der Server-Herzschlag (waechter-daten/server.json) älter als 20 Minuten ist.
on:
  workflow_dispatch:
    inputs:
      aktion:
        description: "Was soll passieren?"
        type: choice
        options:
          - dauerbetrieb
          - lauf
          - simulation
          - simulation-mit-echtem-telegram
          - telegram-test
          - alarm-test-beide
        default: dauerbetrieb

  # ------------------------------------------------------------------
  # REGELMÄSSIGER BETRIEB – AKTIV
  # (README, Abschnitt "Dauerbetrieb"). Zeiten in UTC.
  #   Öffentliches Repository (kostenlos): Dauerbetrieb in Abschnitten, cron nur als Absicherung (alle 30 Min.)
  #   Privates Repository (2.000 Min/Monat): - cron: "7 * * * *" und nur 'lauf' statt 'dauerbetrieb' verwenden
  # ------------------------------------------------------------------
  schedule:
    - cron: "3,33 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  waechter:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TELEGRAM_AKTIV: ${{ vars.TELEGRAM_AKTIV }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Datenzweig vorbereiten
        run: |
          git config user.name "onepiece-waechter[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth=5 origin waechter-daten 2>/dev/null; then
            git worktree add -B waechter-daten _daten origin/waechter-daten
          else
            git worktree add --detach _daten
            cd _daten && git checkout --orphan waechter-daten && git rm -rfq . && cd ..
          fi

      - name: Eigener Server aktiv? (dann pausiert GitHub und springt nur bei Ausfall ein)
        id: server
        run: |
          aktiv=false
          if [ "${{ vars.BETRIEB }}" = "server" ]; then
            alter=$(python3 -c 'import json,datetime as d; j=json.load(open("_daten/server.json")); t=d.datetime.fromisoformat(j["heartbeat"].replace("Z","+00:00")); print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//60))' 2>/dev/null || echo 99999)
            if [ "$alter" -lt 20 ]; then
              aktiv=true
              echo "Eigener Server meldet sich (vor $alter Min.) – GitHub pausiert."
            else
              echo "::warning::Eigener Server ist seit $alter Min. still – GitHub springt ein (Ausfallsicherung)."
            fi
          fi
          echo "aktiv=$aktiv" >> "$GITHUB_OUTPUT"

      - name: Wächter im Dauerbetrieb (ca. 10 Minuten Schleife)
        if: ${{ (github.event_name == 'schedule' || inputs.aktion == 'dauerbetrieb') && steps.server.outputs.aktiv != 'true' }}
        run: python -m waechter dauerlauf --sekunden 600 --daten _daten/laufzeit --dashboard _daten/dashboard.md

      - name: Wächter-Lauf (einmalig)
        if: ${{ inputs.aktion == 'lauf' && steps.server.outputs.aktiv != 'true' }}
        run: python -m waechter lauf --daten _daten/laufzeit --dashboard _daten/dashboard.md

      - name: Simulation (lokaler Test-Shop, Test-Telegram-Server)
        if: ${{ inputs.aktion == 'simulation' }}
        run: |
          python -m waechter simulation --daten _daten/laufzeit
          python -m waechter lauf --daten _daten/laufzeit --dashboard _daten/dashboard.md --ohne-onepiece

      - name: Simulation mit echter Telegram-Testnachricht
        if: ${{ inputs.aktion == 'simulation-mit-echtem-telegram' }}
        run: |
          python -m waechter simulation --telegram-echt --daten _daten/laufzeit
          python -m waechter lauf --daten _daten/laufzeit --dashboard _daten/dashboard.md --ohne-onepiece

      - name: Alarm-Test für Naruto und One Piece (Dojo + echtes Telegram, deutlich als TEST markiert)
        if: ${{ inputs.aktion == 'alarm-test-beide' }}
        run: python -m waechter alarm-test --daten _daten/laufzeit --ziel _daten

      - name: Telegram-Testnachricht
        if: ${{ inputs.aktion == 'telegram-test' }}
        run: python -m waechter telegram-test

      - name: Dashboard in der Zusammenfassung
        if: ${{ always() }}
        run: if [ -f _daten/dashboard.md ]; then cat _daten/dashboard.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Dojo-Seite vorbereiten (nur Statusdatei und Seite, nie der gesamte Zustand)
        if: ${{ always() && inputs.aktion != 'telegram-test' }}
        run: |
          mkdir -p _seite
          for f in index.html status.json icon.png .nojekyll; do
            if [ -f "_daten/$f" ]; then cp "_daten/$f" "_seite/$f"; fi
          done

      - name: Dojo-Seite hochladen
        if: ${{ always() && vars.BETRIEB != 'server' && inputs.aktion != 'telegram-test' && hashFiles('_seite/status.json') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _seite

      - name: Dojo in den Zweig dojo-seite (Server-Betrieb, GitHub springt gerade ein)
        if: ${{ always() && vars.BETRIEB == 'server' && steps.server.outputs.aktiv != 'true' && hashFiles('_seite/status.json') != '' }}
        run: |
          cd _seite
          git init -q -b dojo-seite
          git add -A
          git -c user.name="onepiece-waechter[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Dojo"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dojo-seite

      - name: Zustand dauerhaft speichern
        if: ${{ always() && inputs.aktion != 'telegram-test' && steps.server.outputs.aktiv != 'true' }}
        run: |
          cd _daten
          # Herzschlag des eigenen Servers nie überschreiben (sonst liefen Server und GitHub danach parallel)
          if git fetch -q origin waechter-daten 2>/dev/null && git show FETCH_HEAD:server.json > /tmp/server.json 2>/dev/null; then
            cp /tmp/server.json server.json
          fi
          # Sicherheitsnetz: GitHub lehnt Dateien über 100 MB ab -> große JSONL-Dateien auf die jüngere Hälfte kürzen
          find . -path ./.git -prune -o -type f -size +80M -print | while read -r f; do
            case "$f" in
              *.jsonl) echo "::warning::$f über 80 MB – wird auf die jüngere Hälfte gekürzt"
                       n=$(wc -l < "$f"); tail -n $((n / 2)) "$f" > "$f.tmp" && mv "$f.tmp" "$f" ;;
              *) echo "::error::$f über 80 MB – bitte prüfen" ;;
            esac
          done
          git add -A
          if git diff --cached --quiet; then echo "Keine Änderungen"; exit 0; fi
          # pro Tag ein Commit (wird im Tagesverlauf ergänzt), damit der Zweig nicht mit tausenden Commits wächst
          heute=$(date -u +%Y-%m-%d)
          if git log -1 --format=%s 2>/dev/null | grep -q "Wächter-Daten $heute"; then
            git commit -q --amend -m "Wächter-Daten $heute"
          else
            git commit -q -m "Wächter-Daten $heute"
          fi
          git push -q --force origin waechter-daten

      - name: Nächsten Abschnitt einreihen (Kette fortsetzen – nicht, solange der eigene Server läuft)
        if: ${{ always() && steps.server.outputs.aktiv != 'true' }}
        run: |
          # Hat sich der eigene Server inzwischen gemeldet? Dann übernimmt er – die Kette endet hier.
          if [ "${{ vars.BETRIEB }}" = "server" ]; then
            alter=$(git -C _daten fetch -q origin waechter-daten 2>/dev/null && git -C _daten show FETCH_HEAD:server.json 2>/dev/null \
              | python3 -c 'import sys,json,datetime as d; j=json.load(sys.stdin); t=d.datetime.fromisoformat(j["heartbeat"].replace("Z","+00:00")); print(int((d.datetime.now(d.timezone.utc)-t).total_seconds()//60))' 2>/dev/null || echo 99999)
            if [ "$alter" -lt 20 ]; then echo "Eigener Server meldet sich (vor $alter Min.) – Kette endet."; exit 0; fi
          fi
          # Nur einreihen, wenn nichts wartet (sonst würde eine manuelle Aktion verdrängt) – Wiederholung bei Fehler egal
          wartend=$(gh run list --workflow=waechter.yml --json status --jq '[.[] | select(.status=="pending" or .status=="queued" or .status=="waiting")] | length' 2>/dev/null || echo 0)
          if [ "${wartend:-0}" = "0" ]; then
            gh workflow run waechter.yml --ref "${{ github.ref_name }}" -f aktion=dauerbetrieb || echo "Einreihen fehlgeschlagen (Absicherung per Zeitplan)"
          else
            echo "Es wartet bereits ein Lauf."
          fi

  dojo-veroeffentlichen:
    # Veröffentlicht das Pixel-Dojo (GitHub Pages). Einmalig nötig: Settings -> Pages -> Source: "GitHub Actions".
    needs: waechter
    if: ${{ always() && vars.BETRIEB != 'server' && needs.waechter.result != 'skipped' && inputs.aktion != 'telegram-test' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - name: Dojo veröffentlichen
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
