<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wächter-Dojo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#120d09;--panel:#1d140e;--line:#3a2a1c;--fg:#f3e6cf;--dim:#a8977c;--acc:#f0903c;
        --ok:#6fd16f;--chk:#ffd24a;--rst:#ff5a44;--err:#9a9a9a;--unk:#c9b98a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#2a1c12 0,var(--bg) 60%) fixed;color:var(--fg);
       font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:center;padding:14px}
  #wrap{width:100%;max-width:1100px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 12px}
  h1{font-family:"Press Start 2P",ui-monospace,monospace;font-size:14px;letter-spacing:2px;margin:0;color:var(--acc);
     text-shadow:2px 2px 0 #000}
  #chip{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);white-space:nowrap}
  #chip b{color:var(--acc)}
  #chip.alert{border-color:var(--rst);background:#3a1410;animation:pulse 1s infinite}
  #chip.stale{border-color:#55607a;color:#aab4cc}
  #chip.error{border-color:#c98a2a}
  @keyframes pulse{50%{box-shadow:0 0 0 4px rgba(255,90,68,.25)}}
  #stage{width:fit-content;max-width:100%;margin:0 auto;position:relative;border:4px solid #4a3322;border-radius:6px;box-shadow:0 0 0 2px #120d09,0 10px 40px rgba(0,0,0,.6);
         background:#000;line-height:0;overflow:hidden}
  canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;margin:0 auto}
  #meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--dim);margin:10px 2px}
  #mode.live{color:var(--ok)} #mode.demo{color:var(--chk)}
  #cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin:6px 0 14px;padding:0;list-style:none}
  #cards li{background:var(--panel);border:1px solid var(--line);border-left-width:5px;border-radius:6px;padding:8px 10px;font-size:12px;line-height:1.5}
  #cards li b{display:block;font-size:13px}
  #cards li span{color:var(--dim)}
  #log{list-style:none;padding:0;margin:0;font-size:12px;line-height:1.7}
  #log li{border-bottom:1px solid var(--line);padding:3px 2px}
  #log time{color:var(--dim);margin-right:8px}
  footer{margin:14px 0 4px;font-size:11px;color:#6f604d}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <h1>WÄCHTER-DOJO</h1>
    <div id="chip">Status: <b>…</b></div>
  </header>
  <div id="stage"><canvas id="c"></canvas></div>
  <div id="meta"><span id="mode"></span><span id="upd"></span><span id="stats"></span></div>
  <ul id="cards"></ul>
  <ul id="log"></ul>
  <footer>Tipp: <code>?demo=1</code> zeigt die Demo, <code>?hour=22</code> erzwingt eine Uhrzeit (z. B. Nacht).</footer>
</div>

<script>
'use strict';
const W = 480, H = 270;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
cv.width = W; cv.height = H;
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const bgC = mk(W, H), bg = bgC.getContext('2d');          // statische Szene (Wand, Boden, Teich)
const frC = mk(W, H), fr = frC.getContext('2d');          // Fensterrahmen (Gitter) – liegt über dem Himmel
const lightC = mk(W, H), lg = lightC.getContext('2d');    // Lichtmaske für die Nacht
const Q = new URLSearchParams(location.search);
const STATE_URL = 'status.json';
const FONT = '"Press Start 2P", ui-monospace, monospace';

/* ---------- kleine Helfer ---------- */
let C = ctx;
const R = (x, y, w, h, col) => { C.fillStyle = col; C.fillRect(Math.round(x), Math.round(y), w, h); };
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mixA = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = a => 'rgb(' + a.join(',') + ')';
const mix = (a, b, t) => rgb(mixA(hex(a), hex(b), clamp(t, 0, 1)));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------- Uhrzeit / Himmel ---------- */
function berlinHour() {
  if (Q.has('hour')) return parseFloat(Q.get('hour'));
  try {
    const p = new Intl.DateTimeFormat('de-DE', { timeZone: 'Europe/Berlin', hour: 'numeric', minute: 'numeric', hour12: false }).formatToParts(new Date());
    return +p.find(x => x.type === 'hour').value % 24 + +p.find(x => x.type === 'minute').value / 60;
  } catch (e) { const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
}
function daylight(h) {  // 0 = Nacht, 1 = Tag
  if (h >= 7.5 && h <= 17.5) return 1;
  if (h > 5 && h < 7.5) return (h - 5) / 2.5;
  if (h > 17.5 && h < 20.5) return 1 - (h - 17.5) / 3;
  return 0;
}
const SKY = {
  night: ['#070b22', '#18234a'], dusk: ['#3a3d78', '#f08a5a'], day: ['#4ea4e6', '#cfeaf8']
};
function skyColors(d) {
  if (d > 0.5) { const t = (d - 0.5) * 2; return [mix(SKY.dusk[0], SKY.day[0], t), mix(SKY.dusk[1], SKY.day[1], t)]; }
  const t = d * 2; return [mix(SKY.night[0], SKY.dusk[0], t), mix(SKY.night[1], SKY.dusk[1], t)];
}

/* ---------- Layout ---------- */
const WIN = [24, 134, 244, 354].map(x => ({ x, y: 20, w: 92, h: 62 }));
const LANES = [148, 258], GAPS = [120, 225, 335, 440];
const DESK_X = [200, 330], DESK_TOP = [150, 212];
const TEA = { x: 441, y: 148 }, TEA2 = { x: 441, y: 204 };   // Teeplätze: Ninja (oben), Seemann (unten)
const agentOf = x => x.agent || (String(x.id || '').startsWith('op_') ? 'onepiece' : 'naruto');
// Tisch-Platz je Station: Naruto-Stationen oben (Reihe 0), One-Piece-Stationen unten (Reihe 1), je zwei Tische
function deskCenter(i) {
  const s = ((data && data.sites) || []), a = s[i] ? agentOf(s[i]) : 'naruto';
  const k = s.slice(0, i).filter(x => agentOf(x) === a).length;
  return { x: DESK_X[k % 2], row: a === 'onepiece' ? 1 : 0 };
}
const standPos = i => { const d = deskCenter(i); return { x: d.x, y: LANES[d.row] }; };
const WALL_LAMPS = [{ x: 78, y: 12 }, { x: 188, y: 12 }, { x: 298, y: 12 }, { x: 408, y: 12 }];

/* ---------- statische Szene ---------- */
function buildStatic() {
  C = bg;
  R(0, 0, W, 108, '#2a1d14');
  for (let x = 0; x < W; x += 24) { R(x, 10, 1, 90, '#22170f'); R(x + 1, 10, 1, 90, '#33231a'); }
  for (let i = 0; i < 260; i++) R(Math.floor(rnd() * W), 12 + Math.floor(rnd() * 88), 2, 1, 'rgba(0,0,0,.18)');
  R(0, 0, W, 10, '#1a110b'); R(0, 10, W, 2, '#3b2818'); R(0, 100, W, 8, '#3d2a1b'); R(0, 100, W, 1, '#5a3f27'); R(0, 107, W, 1, '#1a110b');
  // Boden: Tatami
  R(0, 108, W, H - 108, '#b9a56a');
  for (let row = 0; row < 3; row++) {
    const y0 = 108 + row * 60, off = row % 2 ? 60 : 0;
    for (let mx = -60 + off; mx < W; mx += 120) {
      for (let yy = 0; yy < 60; yy += 2) R(mx, y0 + yy, 120, 1, (yy / 2) % 2 ? '#b09b60' : '#bfab72');
      R(mx, y0, 120, 2, '#3f4a2c'); R(mx, y0 + 58, 120, 2, '#3f4a2c'); R(mx, y0, 2, 60, '#3f4a2c'); R(mx + 118, y0, 2, 60, '#3f4a2c');
      R(mx + 2, y0 + 2, 116, 1, '#d5c488');
    }
  }
  for (let i = 0; i < 300; i++) R(Math.floor(rnd() * W), 112 + Math.floor(rnd() * 156), 1, 1, 'rgba(90,70,30,.25)');
  for (let i = 0; i < 16; i++) R(0, 108 + i, W, 1, 'rgba(0,0,0,' + (0.34 * (1 - i / 16)).toFixed(3) + ')');
  // Teich
  const pcx = 58, pcy = 238, rx = 44, ry = 24;
  for (let yy = -ry - 3; yy <= ry + 3; yy++) {
    const half = rx * Math.sqrt(Math.max(0, 1 - Math.pow(yy / (ry + 3), 2))) + 3;
    R(pcx - half, pcy + yy, half * 2, 1, ((yy + 40) % 5 < 2) ? '#8a847a' : '#6c675f');
  }
  for (let yy = -ry; yy <= ry; yy++) {
    const half = rx * Math.sqrt(1 - Math.pow(yy / ry, 2));
    R(pcx - half, pcy + yy, half * 2, 1, mix('#1d5560', '#2f8a94', (yy + ry) / (2 * ry)));
  }
  // Seerosen
  [[34, 244], [72, 232], [58, 252]].forEach(([x, y]) => { R(x - 4, y - 1, 8, 3, '#3f8f4a'); R(x - 3, y - 2, 6, 1, '#58b862'); R(x + 2, y - 3, 2, 2, '#f7c6d9'); });
  // Steinlaterne
  R(14, 184, 18, 4, '#6f6a62'); R(18, 168, 10, 16, '#8a847a'); R(16, 158, 14, 10, '#6f6a62'); R(19, 160, 8, 6, '#ffcf7a'); R(12, 154, 22, 5, '#7c766c'); R(18, 150, 10, 4, '#8a847a');
  // Gong (Gestell)
  R(40, 120, 4, 44, '#4a3322'); R(88, 120, 4, 44, '#4a3322'); R(38, 118, 56, 5, '#5a3f27'); R(36, 162, 60, 4, '#3b2818');
  // Bambus
  [[462, 2], [470, 3], [477, 1]].forEach(([x, w], k) => { for (let y = 124; y > 14; y -= 1) R(x, y, w, 1, (y % 14 < 2) ? '#2d5a2a' : (k % 2 ? '#4f9a46' : '#5db053')); });
  // Wandrolle (Banner)
  R(196, 14, 88, 22, '#7a1f17'); R(196, 14, 88, 2, '#a83228'); R(196, 34, 88, 2, '#4d1410'); R(194, 12, 92, 3, '#3b2818'); R(194, 36, 92, 3, '#3b2818');
  // Fensterrahmen (transparent in der Mitte)
  C = fr;
  WIN.forEach(w => {
    R(w.x - 5, w.y - 5, w.w + 10, 5, '#4a3322'); R(w.x - 5, w.y + w.h, w.w + 10, 8, '#5a3f27');
    R(w.x - 5, w.y, 5, w.h, '#4a3322'); R(w.x + w.w, w.y, 5, w.h, '#4a3322');
    R(w.x - 5, w.y + w.h + 6, w.w + 10, 2, '#2a1d14');
    for (let k = 1; k < 4; k++) R(w.x + k * (w.w / 4) - 1, w.y, 2, w.h, '#4a3322');
    R(w.x, w.y + w.h / 2 - 1, w.w, 2, '#4a3322');
    R(w.x, w.y, w.w, 1, 'rgba(0,0,0,.35)');
  });
  C = ctx;
}

/* ---------- Himmel in den Fenstern ---------- */
const STARS = Array.from({ length: 60 }, () => [Math.floor(rnd() * W), 20 + Math.floor(rnd() * 40), rnd() * 6]);
function mtnH(x, k) { return 24 + 12 * Math.sin(x * 0.045 + k) + 7 * Math.sin(x * 0.11 + k * 2) + 4 * Math.sin(x * 0.27); }
function drawSky(t, d, hour) {
  const [top, bot] = skyColors(d);
  WIN.forEach((w, wi) => {
    ctx.save(); ctx.beginPath(); ctx.rect(w.x, w.y, w.w, w.h); ctx.clip();
    for (let yy = 0; yy < w.h; yy += 3) R(w.x, w.y + yy, w.w, 3, mix(top, bot, yy / w.h));
    // Sterne
    if (d < 0.6) STARS.forEach(([sx, sy, ph]) => { if (sx >= w.x && sx < w.x + w.w && Math.sin(t * 2 + ph) > -0.4) R(sx, sy, 1, 1, 'rgba(255,255,255,' + (0.9 * (1 - d / 0.6)).toFixed(2) + ')'); });
    // Sonne / Mond (laufen über die ganze Wand)
    const sunP = clamp((hour - 5.5) / 15, 0, 1), sx = lerp(-20, W + 20, sunP), sy = 70 - Math.sin(sunP * Math.PI) * 54;
    if (d > 0.05) { R(sx - 6, sy - 6, 12, 12, mix('#ffb26a', '#fff3b0', d)); R(sx - 8, sy - 4, 16, 8, 'rgba(255,230,160,.35)'); R(sx - 4, sy - 8, 8, 16, 'rgba(255,230,160,.35)'); }
    const moonP = ((hour + 24 - 19) % 24) / 11, mx = lerp(-20, W + 20, clamp(moonP, 0, 1)), my = 66 - Math.sin(clamp(moonP, 0, 1) * Math.PI) * 44;
    if (d < 0.7) { R(mx - 6, my - 6, 12, 12, '#f2f0d8'); R(mx - 3, my - 6, 8, 12, '#f2f0d8'); R(mx + 1, my - 3, 3, 3, '#d9d6b8'); R(mx - 4, my + 1, 2, 2, '#d9d6b8'); }
    // Berge
    for (let x = 0; x < w.w; x++) {
      const gx = w.x + x, hh = Math.round(mtnH(gx, 1.3));
      R(gx, w.y + w.h - hh, 1, hh, mix('#2b2f55', '#7a93b8', d * 0.9 + 0.1));
      if (hh > 38) R(gx, w.y + w.h - hh, 1, hh - 38 < 4 ? hh - 34 : 4, mix('#8a93b8', '#ffffff', d));
      const h2 = Math.round(mtnH(gx, 4.1) * 0.55);
      R(gx, w.y + w.h - h2, 1, h2, mix('#141a35', '#3f6a4a', d * 0.85 + 0.1));
    }
    // Ahornbaum (zwei Fenster)
    if (wi === 1 || wi === 3) {
      const bx = w.x + 70, by = w.y + w.h;
      R(bx, by - 26, 3, 26, '#2a1b12'); R(bx - 4, by - 18, 4, 2, '#2a1b12'); R(bx + 3, by - 22, 5, 2, '#2a1b12');
      const lc = mix('#4a2410', '#e0612a', d * 0.8 + 0.2);
      [[-8, -36, 20, 10], [-12, -30, 14, 8], [4, -32, 16, 9], [-2, -42, 12, 8]].forEach(([dx, dy, ww, hh]) => R(bx + dx, by + dy, ww, hh, lc));
      R(bx - 4, by - 38, 6, 3, mix('#5a2c14', '#f08a3a', d * 0.8 + 0.2));
    }
    ctx.restore();
  });
}

/* ---------- Daten (echt oder Demo) ---------- */
let data = null, demo = true, di = -1, hold = 0;
const DEMO_SITES = [['produkt', 'Produkte', 'naruto'], ['entdeckung', 'Entdeckung', 'naruto'], ['op_restock', 'Restock', 'onepiece'], ['op_vorbestellung', 'Vorbestellung', 'onepiece']];
function demoInit() {
  data = { updated: new Date().toISOString(), state: 'idle', current: null, last_run: new Date().toISOString(),
    sites: DEMO_SITES.map(([id, n, ag]) => ({ id, name: n, agent: ag, status: 'ok', last_checked: null, detail: '' })), events: [],
    stats: { haendler: 12, aufgaben: 48, aufgaben_mit_fehlern: 1, push_problem: false } };
  di = -1; hold = 0;
}
function pushEvent(tx) { data.events.unshift({ time: new Date().toISOString(), text: tx }); data.events = data.events.slice(0, 20); }
function demoStep() {
  if (!data || !demo) return;
  const s = data.sites;
  if (hold > 0) { hold--; return; }
  s.forEach(x => { if (x.status !== 'ok') x.status = 'ok'; });
  if (di === s.length - 1) { data.state = 'idle'; data.current = null; di = -1; hold = 3; pushEvent('Runde beendet – Tee-Pause'); return; }
  di++; const x = s[di], r = Math.random();
  data.current = x.id; x.last_checked = new Date().toISOString(); data.last_run = x.last_checked;
  if (r < 0.14) { x.status = 'restock'; data.state = 'alert'; hold = 3; pushEvent('KAUFALARM: ' + x.name + ' jetzt bestellbar → Telegram'); }
  else if (r < 0.24) { x.status = 'error'; data.state = 'error'; hold = 2; pushEvent('Fehler bei ' + x.name); }
  else { x.status = 'checking'; data.state = 'checking'; pushEvent('prüfe ' + x.name); }
  data.updated = new Date().toISOString();
}
async function poll() {
  if (Q.has('demo')) { if (!data || !demo) { demo = true; demoInit(); } return; }
  try {
    const r = await fetch(STATE_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!r.ok) throw new Error('http');
    data = await r.json(); demo = false;
  } catch (e) { if (!demo || !data) { demo = true; demoInit(); } }
}
function applyOverrides() {
  if (!data) return;
  if (Q.has('state')) { data.state = Q.get('state'); }
  if (Q.get('state') === 'alert' && data.sites[0]) data.sites[0].status = 'restock';
  if (Q.get('op') === 'alert') { const o = data.sites.find(x => x.id === 'op_restock'); if (o) o.status = 'restock'; data.state = 'alert'; }
  if (Q.get('op') === 'pre') { const o = data.sites.find(x => x.id === 'op_vorbestellung'); if (o) o.status = 'restock'; data.state = 'alert'; }
  if (Q.get('state') === 'error' && data.sites[1]) data.sites[1].status = 'error';
}
poll(); setInterval(poll, 4000); setInterval(demoStep, 3500);
const sites = () => ((data && data.sites) || []).slice(0, 8);

/* ---------- Wächter ---------- */
const newG = (x, y) => ({ x, y, face: -1, phase: 0, path: [], key: '', moving: false, blink: 0, nextBlink: 2 });
const GP = { skin: '#e9b98a', skinS: '#c9966a', robe: '#3f7a86', robeS: '#2c5560', robeH: '#5aa3ad', inner: '#efe3c6', belt: '#b6392e', beltS: '#862a22',
  pants: '#27344d', pantsB: '#1b2538', sandal: '#3a2616', hair: '#2a1d18', hat: '#d4ae55', hatH: '#ecd07f', hatS: '#a9863a', hatU: '#6f521c',
  scarf: '#c0392b', scarfS: '#8f2a20', eye: '#1c1612' };
// zweiter Agent: One-Piece-Wächter (eigene Figur: Seemann mit blauem Kopftuch, keine bekannte Figur)
const GP2 = { skin: '#e2a878', skinS: '#bd8456', robe: '#ece4d0', robeS: '#b9ae93', robeH: '#fffaf0', inner: '#c24a3a', belt: '#2f5aa8', beltS: '#1f3d78',
  pants: '#5a4a6a', pantsB: '#3f334d', sandal: '#2a1a10', hair: '#6a3a1a', hat: '#2f5aa8', hatH: '#4f7cd0', hatS: '#1f3d78', hatU: '#1f3d78',
  scarf: '#2f5aa8', scarfS: '#1f3d78', eye: '#1c1612' };
const A1 = { g: newG(TEA.x, TEA.y), P: GP, kind: 'ninja' };
const A2 = { g: newG(TEA2.x, TEA2.y), P: GP2, kind: 'seemann' };
const g = A1.g;
function route(from, to) {
  const lane = y => Math.abs(y - LANES[0]) < Math.abs(y - LANES[1]) ? 0 : 1;
  if (lane(from.y) === lane(to.y)) return [{ x: to.x, y: to.y }];
  const gx = GAPS.reduce((a, b) => (Math.abs(b - from.x) + Math.abs(b - to.x) < Math.abs(a - from.x) + Math.abs(a - to.x) ? b : a));
  return [{ x: gx, y: from.y }, { x: gx, y: to.y }, { x: to.x, y: to.y }];
}
const mineOf = ag => sites().map((x, i) => agentOf(x) === ag ? i : -1).filter(i => i >= 0);
function rotate(t, lst) { return lst[Math.floor(t / 5) % lst.length]; }
function plan2(t) {  // One-Piece-Seemann: nur seine zwei Tische (Restock, Vorbestellung)
  const s = sites(), mine = mineOf('onepiece'), st = data ? data.state : 'idle';
  if (!mine.length) return null;
  const tea = { x: TEA2.x, y: TEA2.y };
  if (st === 'stale') return { ...tea, mode: 'sleep', idx: -1 };
  const go = (i, mode) => { const p = standPos(i); return { x: p.x, y: p.y, mode, idx: i }; };
  const ri = mine.find(i => s[i].status === 'restock'); if (ri !== undefined) return go(ri, 'alert');
  const ei = mine.find(i => s[i].status === 'error'); if (ei !== undefined) return go(ei, 'error');
  const aktiv = mine.filter(i => (s[i].im_lauf && st !== 'idle') || s[i].status === 'checking');
  if (aktiv.length) return go(rotate(t, aktiv), 'check');
  return { ...tea, mode: 'idle', idx: -1 };
}
function plan(t) {  // Naruto-Ninja: nur seine zwei Tische (Produkte, Entdeckung)
  const s = sites(), mine = mineOf('naruto'), st = data ? data.state : 'idle';
  const go = (i, mode) => { const p = standPos(i); return { x: p.x, y: p.y, mode, idx: i }; };
  const tea = mode => ({ x: TEA.x, y: TEA.y, mode, idx: -1 });
  const ri = mine.find(i => s[i].status === 'restock'); if (ri !== undefined) return go(ri, 'alert');
  const ei = mine.find(i => s[i].status === 'error');
  if (st === 'error' && ei !== undefined) return go(ei, 'error');
  if (st === 'checking' && mine.length) {
    const ci = mine.find(i => s[i].id === (data && data.current));
    if (ci !== undefined) return go(ci, 'check');
    const akt = mine.filter(i => s[i].im_lauf);
    return go(rotate(t, akt.length ? akt : mine), 'check');
  }
  if (st === 'error') return tea('error');
  if (st === 'stale') return tea('sleep');
  return tea('idle');
}
function stepGuard(A, pl, dt) {
  const g = A.g;
  const key = pl.x + ',' + pl.y;
  if (key !== g.key) { g.key = key; g.path = route(g, pl); }
  g.moving = false;

  for (let k = 0; k < 2; k++) { const ph = (t * 0.6 + k * 0.5) % 1; R(473 + o + Math.round(Math.sin(t * 2 + k) * 2), 197 + dy - ph * 14, 1, 1, 'rgba(255,255,255,' + (0.6 - ph * 0.5).toFixed(2) + ')'); }
}
function drawRowSign(cx, top, text, c1, c2) {  // Schild zwischen den Tischen: Wer ist hier zuständig?
  R(cx - 1, top + 6, 3, 18, '#3b2818'); R(cx - 29, top - 8, 58, 15, c2); R(cx - 28, top - 7, 56, 13, c1);
  R(cx - 28, top - 7, 56, 1, 'rgba(255,255,255,.25)');
  ctx.font = '6px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = '#fff6dc'; ctx.fillText(text, cx, top + 3);
}

/* ---------- Pflanzen, Teich, Partikel ---------- */
const FISH = [{ cx: 58, cy: 238, rx: 30, ry: 15, sp: 0.8, ph: 0, col: '#f08a3a' }, { cx: 58, cy: 238, rx: 22, ry: 12, sp: -1.1, ph: 2, col: '#f4efe6' }, { cx: 58, cy: 240, rx: 34, ry: 10, sp: 0.6, ph: 4, col: '#d8402e' }];
function drawPond(t) {
  FISH.forEach(f => {
    for (let k = 4; k >= 0; k--) { const a = t * f.sp + f.ph - k * 0.12 * Math.sign(f.sp); R(f.cx + Math.cos(a) * f.rx - 2, f.cy + Math.sin(a) * f.ry - 1, k === 0 ? 4 : 3, k === 0 ? 3 : 2, f.col); }
  });
  for (let k = 0; k < 2; k++) { const ph = (t * 0.25 + k * 0.5) % 1, r = Math.round(ph * 16); ctx.strokeStyle = 'rgba(200,240,245,' + (0.5 - ph * 0.5).toFixed(2) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.ellipse(40 + k * 36, 232 + k * 6, r, r * 0.5, 0, 0, 7); ctx.stroke(); }
}
function drawGong(t, ringing, lights) {
  const sh = ringing ? Math.round(Math.sin(t * 40) * 1.5) : 0, cx = 66 + sh, cy = 142;
  R(cx - 1, 123, 2, 8, '#2a1d14');
  for (let yy = -13; yy <= 13; yy++) { const half = Math.round(Math.sqrt(169 - yy * yy)); R(cx - half, cy + yy, half * 2, 1, mix('#c9962a', '#ffe17a', (13 - yy) / 40 + (yy < -6 ? 0.1 : 0))); }
  for (let yy = -6; yy <= 6; yy++) { const half = Math.round(Math.sqrt(36 - yy * yy)); R(cx - half, cy + yy, half * 2, 1, '#9a6e18'); }
  R(cx - 2, cy - 2, 4, 4, '#e0b84a');
  if (ringing) for (let k = 0; k < 3; k++) { const ph = (t * 1.5 + k / 3) % 1; ctx.strokeStyle = 'rgba(255,225,120,' + (0.7 - ph * 0.7).toFixed(2) + ')'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(cx, cy, 15 + ph * 26, 0, 7); ctx.stroke(); }
}
function drawBamboo(t) {
  [[462, 2], [470, 3], [477, 1]].forEach(([x, w], k) => { const sw = Math.sin(t * 0.8 + k) * 1.2; for (let y = 24; y > 8; y -= 4) { R(x + sw * (1 - y / 30) - 3, y + 6, 6, 2, '#6cc25f'); R(x + sw * (1 - y / 30) + 4, y + 10, 5, 2, '#58a64c'); } });
}
const LEAVES = Array.from({ length: 26 }, () => ({ x: rnd() * W, y: rnd() * H, vx: 6 + rnd() * 10, vy: 8 + rnd() * 10, ph: rnd() * 6, c: ['#e0612a', '#c0392b', '#f0a53a', '#b84a1e'][Math.floor(rnd() * 4)] }));
function drawLeaves(t, dt) {
  LEAVES.forEach(l => {
    l.x += (l.vx + Math.sin(t + l.ph) * 8) * dt; l.y += l.vy * dt;
    if (l.y > H + 4 || l.x > W + 6) { l.x = -4 - rnd() * 40; l.y = -4 - rnd() * 60; }
    const fl = Math.sin(t * 5 + l.ph) > 0;
    R(l.x, l.y, fl ? 3 : 2, fl ? 2 : 3, l.c);
  });
}
const FLIES = Array.from({ length: 12 }, () => ({ x: 20 + rnd() * 110, y: 200 + rnd() * 60, ph: rnd() * 6 }));
function drawFireflies(t, dark) {
  if (dark < 0.3) return;
  FLIES.forEach(f => { const x = f.x + Math.sin(t * 0.7 + f.ph) * 10, y = f.y + Math.cos(t * 0.9 + f.ph) * 6, a = (0.5 + 0.5 * Math.sin(t * 3 + f.ph)) * dark; R(x, y, 2, 2, 'rgba(220,255,140,' + a.toFixed(2) + ')'); R(x - 1, y, 4, 2, 'rgba(220,255,140,' + (a * 0.25).toFixed(2) + ')'); });
}

/* ---------- Licht ---------- */
function drawLightMap(dark, lights) {
  if (dark < 0.02) return;
  lg.globalCompositeOperation = 'source-over'; lg.clearRect(0, 0, W, H);
  lg.fillStyle = 'rgba(6,10,40,' + (0.68 * dark).toFixed(3) + ')'; lg.fillRect(0, 0, W, H);
  lg.globalCompositeOperation = 'destination-out';
  lights.forEach(l => { const gr = lg.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r); gr.addColorStop(0, 'rgba(0,0,0,' + l.a + ')'); gr.addColorStop(1, 'rgba(0,0,0,0)'); lg.fillStyle = gr; lg.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2); });
  ctx.drawImage(lightC, 0, 0);
  ctx.globalCompositeOperation = 'lighter';
  lights.forEach(l => { const gr = ctx.createRadialGradient(l.x, l.y, 0, l.x, l.y, l.r); const c = l.col || [255, 200, 120]; gr.addColorStop(0, 'rgba(' + c.join(',') + ',' + (0.22 * dark * l.a).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(' + c.join(',') + ',0)'); ctx.fillStyle = gr; ctx.fillRect(l.x - l.r, l.y - l.r, l.r * 2, l.r * 2); });
  ctx.globalCompositeOperation = 'source-over';
}
function drawSunbeams(t, d) {
  if (d < 0.4) return;
  ctx.fillStyle = 'rgba(255,240,190,' + (0.07 * d + Math.sin(t * 0.5) * 0.01).toFixed(3) + ')';
  WIN.forEach(w => { ctx.beginPath(); ctx.moveTo(w.x + 10, w.y + w.h + 8); ctx.lineTo(w.x + w.w - 10, w.y + w.h + 8); ctx.lineTo(w.x + w.w + 46, 190); ctx.lineTo(w.x + 36, 190); ctx.closePath(); ctx.fill(); });
}

/* ---------- Hauptschleife ---------- */
let last = performance.now() / 1000, fallStarted = false;
function frame() {
  const t = performance.now() / 1000, dt = Math.min(0.1, t - last); last = t;
  if (!data) { requestAnimationFrame(frame); return; }
  applyOverrides();
  const hour = berlinHour(), d = daylight(hour), dark = 1 - d;
  const lights = [];
  const pl = plan(t); stepGuard(A1, pl, dt);
  const pl2 = plan2(t); if (pl2) stepGuard(A2, pl2, dt);
  ctx.drawImage(bgC, 0, 0);
  drawSky(t, d, hour);
  ctx.drawImage(frC, 0, 0);
  // Wandlaternen
  WALL_LAMPS.forEach((l, i) => { const fl = 0.85 + Math.sin(t * 7 + i * 2) * 0.12; R(l.x, l.y - 12, 1, 12, '#1a1a1a'); R(l.x - 6, l.y, 13, 2, '#4a2a12'); R(l.x - 6, l.y + 2, 13, 14, '#d8742a'); R(l.x - 5, l.y + 3, 11, 12, mix('#f0a14a', '#ffe08a', fl - 0.7)); R(l.x - 6, l.y + 8, 13, 1, '#a8501a'); R(l.x - 6, l.y + 16, 13, 2, '#4a2a12'); R(l.x - 2, l.y + 18, 1, 6, '#c0392b'); R(l.x + 2, l.y + 18, 1, 5, '#c0392b');
    lights.push({ x: l.x, y: l.y + 10, r: 78, a: 0.95 * fl, col: [255, 170, 80] }); });
  ctx.font = '8px ' + FONT; ctx.textAlign = 'center'; ctx.fillStyle = '#f3e6cf'; ctx.fillText('WÄCHTER-DOJO', 240, 29);
  lights.push({ x: 23, y: 164, r: 50, a: 0.9, col: [255, 207, 122] });
  drawBamboo(t);
  drawPond(t);
  drawGong(t, pl.mode === 'alert' || (pl2 && pl2.mode === 'alert'), lights);
  drawTea(t, -56, ['#c8641f', '#e8893a', '#8f4513']);   // Ninja (oben, orange)
  drawTea(t, 0, ['#1f3d78', '#3f64a8', '#14285a']);       // Seemann (unten, blau)
  { const ms = mineOf('naruto'), mo = mineOf('onepiece');
    if (ms.length) drawRowSign(265, DESK_TOP[0] + 4, 'NARUTO', '#d8742a', '#7a3d12');
    if (mo.length) drawRowSign(265, DESK_TOP[1] + 4, 'ONE PIECE', '#2a4f94', '#14285a'); }
  // Sortiert zeichnen: Pulte / Wächter / Katze
  const s = sites(), items = [];
  s.forEach((site, i) => { const c = deskCenter(i); items.push({ y: DESK_TOP[c.row] + 24, draw: () => drawDesk(i, site, t, (pl.idx === i && pl.mode === 'check' && !g.moving) || (pl2 && pl2.idx === i && pl2.mode === 'check' && !A2.g.moving), lights) }); });
  let head = null, head2 = null;
  items.push({ y: g.y + 0.5, draw: () => { head = drawGuard(A1, t, g.moving ? 'walk' : pl.mode, lights); } });
  if (pl2) items.push({ y: A2.g.y + 0.5, draw: () => { head2 = drawGuard(A2, t, A2.g.moving ? 'walk' : pl2.mode, lights); } });
  items.push({ y: cat.y, draw: () => drawCat(t, pl.mode, !!(pl2 && pl2.mode === 'alert')) });
  deskLabels = [];
  items.sort((a, b) => a.y - b.y).forEach(it => it.draw());
  deskLabels.forEach(f => f());
  // Sprechblasen
  if (head && !g.moving) {
    const hx = head.x, hy = head.y - 2;
    if (pl.mode === 'alert') bubbleAt(hx, hy, 'RESTOCK!', '#fff', '#c0392b');
    else if (pl.mode === 'error') bubbleAt(hx, hy, '?!', '#fff', '#6a6a6a');
    else if (pl.mode === 'check') bubbleAt(hx, hy, '.'.repeat(1 + Math.floor(t * 2.5) % 3), '#fff', '#8a6a1a');
    else if (pl.mode === 'sleep') bubbleAt(hx, hy + 4, 'z'.repeat(1 + Math.floor(t / 2) % 3), '#cfd6ee', '#2f3a66');
  }
  if (head2 && pl2 && !A2.g.moving) {
    const hx = head2.x, hy = head2.y - 2;
    if (pl2.mode === 'alert') bubbleAt(hx, hy, 'RESTOCK!', '#fff', '#c0392b');
    else if (pl2.mode === 'error') bubbleAt(hx, hy, '?!', '#fff', '#6a6a6a');
    else if (pl2.mode === 'check') bubbleAt(hx, hy, '.'.repeat(1 + Math.floor(t * 2.5) % 3), '#fff', '#1f3d78');
    else if (pl2.mode === 'sleep') bubbleAt(hx, hy + 4, 'z'.repeat(1 + Math.floor(t / 2) % 3), '#cfd6ee', '#2f3a66');
  }
  if (pl2 && pl2.mode === 'alert') bubbleAt(cat.x + 4, cat.y - 62 + Math.round(Math.sin(t * 8) * 1), 'ARRR!', '#fff', '#101016');
  // Falke
  if (pl.mode === 'alert' && !falcon && t - lastFalcon > 6) { falcon = { x: g.x, y: g.y - 60 }; lastFalcon = t; }
  if (falcon) { falcon.x += 78 * dt; falcon.y -= 16 * dt + Math.sin(t * 3) * 0.3; if (falcon.x > W + 30) falcon = null; }
  drawFalcon(t);
  drawSunbeams(t, d);
  drawLeaves(t, dt);
  drawFireflies(t, dark);
  drawLightMap(dark, lights);
  // Alarm-Rahmen
  if (pl.mode === 'alert' || (pl2 && pl2.mode === 'alert')) { const a = 0.35 + Math.sin(t * 8) * 0.2; ctx.strokeStyle = 'rgba(255,200,70,' + a.toFixed(2) + ')'; ctx.lineWidth = 4; ctx.strokeRect(2, 2, W - 4, H - 4); }
  if (pl.mode === 'sleep') { ctx.fillStyle = 'rgba(40,50,90,.18)'; ctx.fillRect(0, 0, W, H); }
  updateBar();
  requestAnimationFrame(frame);
}

/* ---------- Größe (ganzzahlig skalieren wenn möglich) ---------- */
function fit() {
  const avail = document.getElementById('stage').parentElement.clientWidth - 8;
  const k = avail >= W ? Math.max(1, Math.floor(avail / W * 2) / 2) : avail / W;  // 1x, 1.5x, 2x, …
  cv.style.width = Math.round(W * Math.min(k, avail / W)) + 'px';
  cv.style.height = Math.round(H * Math.min(k, avail / W)) + 'px';
}
addEventListener('resize', fit);

/* ---------- Statuszeile, Karten, Log ---------- */
const LABEL = { idle: 'ruht (Tee-Pause)', checking: 'prüft Seiten', alert: 'RESTOCK GEFUNDEN', error: 'Problem', stale: 'schläft – kein aktueller Lauf' };
const SLABEL = { ok: 'ok', checking: 'wird geprüft', restock: 'RESTOCK', error: 'Fehler', unknown: 'unbekannt' };
const fmt = iso => { try { return new Date(iso).toLocaleTimeString('de-DE'); } catch (e) { return '–'; } };
const ago = iso => { try { const m = Math.round((Date.now() - new Date(iso)) / 60000); return m < 1 ? 'gerade eben' : m < 120 ? 'vor ' + m + ' min' : 'vor ' + Math.round(m / 60) + ' h'; } catch (e) { return '–'; } };
let lastSig = '';
function updateBar() {
  if (!data) return;
  const chip = document.getElementById('chip');
  chip.className = data.state === 'alert' ? 'alert' : data.state === 'stale' ? 'stale' : data.state === 'error' ? 'error' : '';
  chip.querySelector('b').textContent = LABEL[data.state] || data.state || '?';
  const m = document.getElementById('mode'); m.textContent = demo ? 'DEMO-MODUS (keine status.json gefunden)' : '● live'; m.className = demo ? 'demo' : 'live';
  document.getElementById('upd').textContent = data.last_run ? 'Letzter Lauf: ' + ago(data.last_run) : 'Stand: ' + fmt(data.updated);
  const st = data.stats;
  document.getElementById('stats').textContent = st ? 'Händler: ' + (st.haendler ?? '–') + ' · Aufgaben: ' + st.aufgaben + ' (Fehler: ' + st.aufgaben_mit_fehlern + ')' + (st.push_problem ? ' · ⚠ Push-Problem' : '') : '';
  const sig = JSON.stringify([data.sites, data.events]);
  if (sig === lastSig) return; lastSig = sig;
  const ul = document.getElementById('cards'); ul.textContent = '';
  sites().forEach(x => {
    const li = document.createElement('li'); li.style.borderLeftColor = SCOL[x.status] || SCOL.unknown;
    const b = document.createElement('b'); b.textContent = (agentOf(x) === 'onepiece' ? 'One Piece · ' : 'Naruto · ') + x.name + ' – ' + (SLABEL[x.status] || x.status);
    const sp = document.createElement('span'); sp.textContent = (x.detail || '') + (x.last_checked ? ' · zuletzt ' + ago(x.last_checked) : '');
    li.appendChild(b); li.appendChild(sp); ul.appendChild(li);
  });
  const lg2 = document.getElementById('log'); lg2.textContent = '';
  (data.events || []).slice(0, 8).forEach(e => { const li = document.createElement('li'), tm = document.createElement('time'); tm.textContent = fmt(e.time); li.appendChild(tm); li.appendChild(document.createTextNode(e.text)); lg2.appendChild(li); });
}

buildStatic(); fit();
(document.fonts && document.fonts.load ? document.fonts.load('8px "Press Start 2P"') : Promise.resolve()).catch(() => {}).finally(() => requestAnimationFrame(frame));
</script>
